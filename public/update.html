<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cập nhật tài khoản</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    width:800px;
    margin:30px auto;
    border:1px solid #999;
    background:white;
}

.header{
    padding:10px;
    border-bottom:1px solid #999;
}

.nav{
    border-bottom:1px solid #999;
    padding:8px;
    text-align:center;
}

.update-box{
    width:350px;
    margin:50px auto;
    border:1px solid #999;
    padding:20px;
}

.update-box h3{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:12px;
}

label{
    display:inline-block;
    width:120px;
}

input{
    width:180px;
    padding:5px;
}

.actions{
    margin-top:15px;
    text-align:right;
}

button{
    background:#1e88e5;
    color:white;
    border:none;
    padding:7px 14px;
    cursor:pointer;
}

.footer{
    border-top:1px solid #999;
    padding:8px;
    text-align:center;
    margin-top:40px;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
Lập trình web
</div>

<div class="nav">
Home | Đăng nhập | Đăng ký
</div>

<div class="update-box">

<h3>Màn hình cập nhật</h3>

<div class="form-group">
<label>Username</label>
<input type="text" value="xxx">
</div>

<div class="form-group">
<label>Mật khẩu</label>
<input type="password" value="xxx">
</div>

<div class="form-group">
<label>Nhập lại mật khẩu</label>
<input type="password" value="xxx">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" value="xxx">
</div>

<div class="actions">
<a href="#">Đã có tài khoản</a>
<button>Cập nhật</button>
</div>

</div>

<div class="footer">
Lập trình web @01/2024
</div>

</div>

</body>
</html>
