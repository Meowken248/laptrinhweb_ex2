<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lập trình web</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    width:800px;
    margin:30px auto;
    border:1px solid #999;
    background:white;
}

.header{
    padding:10px;
    border-bottom:1px solid #999;
}

.nav{
    border-bottom:1px solid #999;
    padding:8px;
    text-align:center;
}

.login-box{
    width:300px;
    margin:50px auto;
    border:1px solid #999;
    padding:20px;
}

.login-box h3{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:10px;
}

label{
    display:inline-block;
    width:80px;
}

input[type="text"],
input[type="password"]{
    width:180px;
    padding:5px;
}

.actions{
    margin-top:10px;
    text-align:right;
}

button{
    background:#1e88e5;
    color:white;
    border:none;
    padding:6px 12px;
    cursor:pointer;
}

.footer{
    border-top:1px solid #999;
    padding:8px;
    text-align:center;
    margin-top:40px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    Lập trình web
</div>

<div class="nav">
    Home | Đăng nhập | Đăng ký
</div>

<div class="login-box">
    <h3>Màn hình đăng nhập</h3>

    <div class="form-group">
        <label>Username</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password">
    </div>

    <div class="form-group">
        <input type="checkbox"> Ghi nhớ đăng nhập
    </div>

    <div class="actions">
        <a href="#">Quên mật khẩu</a>
        <button>Đăng nhập</button>
    </div>

</div>

<div class="footer">
    Lập trình web @01/2024
</div>

</div>

</body>
</html>
