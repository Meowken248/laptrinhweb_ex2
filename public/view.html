<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chi tiết user</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    width:800px;
    margin:30px auto;
    border:1px solid #999;
    background:white;
}

.header{
    padding:10px;
    border-bottom:1px solid #999;
}

.nav{
    border-bottom:1px solid #999;
    padding:8px;
    text-align:center;
}

.detail-box{
    width:350px;
    margin:50px auto;
    border:1px solid #999;
    padding:20px;
}

.detail-box h3{
    text-align:center;
    margin-bottom:20px;
}

.info{
    margin-bottom:10px;
}

label{
    display:inline-block;
    width:100px;
}

button{
    background:#1e88e5;
    color:white;
    border:none;
    padding:7px 14px;
    cursor:pointer;
}

.actions{
    text-align:right;
    margin-top:20px;
}

.footer{
    border-top:1px solid #999;
    padding:8px;
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
Lập trình web
</div>

<div class="nav">
Home | Đăng xuất
</div>

<div class="detail-box">

<h3>Màn hình chi tiết</h3>

<div class="info">
<label>Username</label>
<span>test1</span>
</div>

<div class="info">
<label>Email</label>
<span>test1@gmail.com</span>
</div>

<div class="actions">
<button>Chỉnh sửa</button>
</div>

</div>

<div class="footer">
Lập trình web @01/2024
</div>

</div>

</body>
</html>
